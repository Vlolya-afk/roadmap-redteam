site_name: Red Team Roadmap — 0 → Senior
site_description: Практический трек в кибербезопасность с упором на red team. 21 модуль, 94 лаборатории, контрольные.
site_author: Vladislav
site_url: https://Vlolya-afk.github.io/redteam-roadmap/
repo_url: https://github.com/Vlolya-afk/redteam-roadmap
repo_name: Vlolya-afk/redteam-roadmap
edit_uri: edit/main/docs/
docs_dir: docs
copyright: >
  Код — MIT · Тексты и лабы — CC BY-SA 4.0 · Только для собственной изолированной лаборатории

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ru
        - en
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: ru
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vlolya-afk
    - icon: fontawesome/solid/globe
      link: https://Vlolya-afk.github.io/

# Навигация строится автоматически плагином awesome-pages.
# Порядок внутри папок задаётся префиксами m00-, l01-, а заголовки берутся из H1.
# Ручной nav здесь не нужен и конфликтует с плагином.

extra_css:
  - stylesheets/extra.css
